optimizer: adamw
model_name: distilbert-base-uncased
num_labels: 2
seed: 42
output_dir: outputs/experiments/adamw_best
data:
  dataset_name: stanfordnlp/sst2
  dataset_config: null
  text_field: sentence
  label_field: label
  max_length: 128
  train_subset: null
  val_subset: null
  test_from_train: 2000
  probe_size: 64
optim:
  lr: 5.829082925371146e-05
  weight_decay: 0.25789496255866534
  momentum: 0.95
  adam_lr: 0.0003
  betas:
  - 0.8672721810967422
  - 0.999
  eps: 1.0e-08
train:
  max_steps: 5000
  batch_size: 32
  grad_accum: 1
  warmup_ratio: 0.1
  scheduler: linear
  eval_every: 200
  metric_every: 100
  probe_every: 100
  grad_clip: 1.0
  precision: 32-true
sharpness:
  n_directions: 30
  eps_list:
  - 0.001
  - 0.01
  - 0.05
  n_eval_batches: 8
